<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechVision Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1d21 0%, #2d3748 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .login-card h3 { font-weight: 700; color: #1a1d21; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 .2rem rgba(13,110,253,.25); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h3><i class="bi bi-shop me-2"></i>TechVision</h3>
            <p class="text-muted">Admin Panel</p>
        </div>
        <div id="alert" class="alert alert-danger d-none"></div>
        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="admin@techvision.vn" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" value="admin123" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btn-login">Đăng nhập</button>
        </form>
        <div class="text-center mt-3">
            <a href="../index.html" class="text-decoration-none small me-3">&larr; Quay về</a>
            <a href="index.html" class="text-decoration-none small text-primary">→ Admin Panel</a>
        </div>
    </div>
    <script>
        const API = 'https://techvision-api.onrender.com/api';
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const alert = document.getElementById('alert');
            btn.disabled = true;
            btn.textContent = 'Đang đăng nhập...';
            alert.classList.add('d-none');
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Đăng nhập thất bại');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.data?.user || {}));
                window.location.href = 'index.html';
            } catch (err) {
                alert.textContent = err.message;
                alert.classList.remove('d-none');
                btn.disabled = false;
                btn.textContent = 'Đăng nhập';
            }
        }
    </script>
</body>
</html>
