<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechVision Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be Vietnam Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tv-primary: #2563eb;
            --tv-primary-dark: #1d4ed8;
            --tv-dark: #0f172a;
        }
        * { font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
            position: relative;
            overflow: hidden;
        }
        /* Decorative blurred orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .35;
            z-index: 0;
        }
        body::before { width: 480px; height: 480px; background: #3b82f6; top: -120px; left: -100px; }
        body::after { width: 420px; height: 420px; background: #7c3aed; bottom: -140px; right: -80px; }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, .98);
            border-radius: 24px;
            width: 100%;
            max-width: 430px;
            padding: 44px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
            animation: fadeUp .5s cubic-bezier(.16, 1, .3, 1);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand-icon {
            width: 68px; height: 68px;
            margin: 0 auto 18px;
            display: grid; place-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--tv-primary), #7c3aed);
            box-shadow: 0 10px 26px rgba(37, 99, 235, .4);
            font-size: 2rem; color: #fff;
        }
        h3 { font-weight: 700; color: var(--tv-dark); letter-spacing: -.02em; }
        .subtitle { color: #64748b; font-size: .92rem; }

        .form-label { font-weight: 600; font-size: .875rem; color: #334155; margin-bottom: .4rem; }
        .input-group-text {
            background: #f8fafc;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }
        .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
            padding: .7rem .9rem;
            font-size: .95rem;
        }
        .form-control:focus {
            border-color: var(--tv-primary);
            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .15);
        }
        .input-group:focus-within .input-group-text {
            border-color: var(--tv-primary);
            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .15);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--tv-primary), #7c3aed);
            border: none;
            border-radius: 12px;
            padding: .78rem;
            font-weight: 600;
            font-size: .98rem;
            box-shadow: 0 8px 22px rgba(37, 99, 235, .35);
            transition: transform .15s, box-shadow .15s, opacity .15s;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37, 99, 235, .45); }
        .btn-login:disabled { opacity: .65; }

        .alert { border-radius: 12px; font-size: .9rem; border: none; }
        .alert-danger { background: #fef2f2; color: #b91c1c; }

        .footer-link {
            color: #64748b; text-decoration: none; font-size: .85rem;
            transition: color .15s;
        }
        .footer-link:hover { color: var(--tv-primary); }

        @media (max-width: 480px) {
            .login-card { padding: 34px 24px; border-radius: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <div class="brand-icon"><i class="bi bi-shop"></i></div>
            <h3 class="mb-1">TechVision</h3>
            <p class="subtitle mb-4">Đăng nhập hệ thống quản trị</p>
        </div>

        <div id="alert" class="alert alert-danger d-none"></div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" value="admin@techvision.vn" required autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" value="admin123" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100 text-white" id="btn-login">Đăng nhập</button>
        </form>

        <div class="text-center mt-4 d-flex justify-content-center gap-3">
            <a href="../index.html" class="footer-link"><i class="bi bi-arrow-left me-1"></i>Quay về</a>
            <a href="index.html" class="footer-link"><i class="bi bi-speedometer2 me-1"></i>Admin Panel</a>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api';

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const alert = document.getElementById('alert');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
            alert.classList.add('d-none');

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || data.error || 'Đăng nhập thất bại');

                localStorage.setItem('token', data.token || data.data?.token);
                localStorage.setItem('user', JSON.stringify(data.data?.user || {}));
                window.location.href = 'index.html';
            } catch (err) {
                alert.textContent = err.message;
                alert.classList.remove('d-none');
                btn.disabled = false;
                btn.textContent = 'Đăng nhập';
            }
        }
    </script>
</body>
</html>
