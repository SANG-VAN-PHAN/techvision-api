# render.yaml - Auto-deploy configuration
# Deploy: https://dashboard.render.com/blueprints

services:
  - type: web
    name: techvision-api
    env: node
    region: singapore  # Gần VN, latency thấp
    plan: free  # $0/tháng (750h/month)
    
    # Build settings
    buildCommand: npm install
    startCommand: npm start
    
    # Environment variables (set in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # MongoDB Atlas - ADD YOUR OWN
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard

      # JWT - ADD YOUR OWN
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard

      # Email - Resend (fallback, giới hạn người nhận nếu chưa verify domain)
      - key: RESEND_API_KEY
        sync: false  # Set in Render dashboard

      # OAuth Credentials
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set in Render dashboard
      - key: GOOGLE_REDIRECT_URI
        value: https://techvision-api.onrender.com/api/auth/google/callback
      - key: FACEBOOK_APP_ID
        sync: false  # Set in Render dashboard
      - key: FACEBOOK_APP_SECRET
        sync: false  # Set in Render dashboard
      - key: BASE_URL
        value: https://techvision-api.onrender.com

      # SMTP - Brevo (gửi đến mọi người, không cần verify domain)
      # https://app.brevo.com/settings/keys/smtp
      - key: SMTP_HOST
        sync: false  # smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false  # SMTP key của bạn
      - key: SMTP_PASS
        sync: false  # SMTP key của bạn
      - key: SMTP_FROM
        sync: false  # Email đã verify trong Brevo, ví dụ: no-reply@techvision.vn

      - key: JWT_EXPIRES_IN
        value: 7d

      # Frontend URL (CORS + link xác minh email)
      - key: FRONTEND_URL
        value: https://techvision-api.onrender.com

# Free tier limits:
# - 750 hours/month
# - Sleeps after 15 min inactivity (cold start ~30s)
# - No persistent disk (use Atlas for data)
# - 512MB RAM
